
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Axel Iota – Blog</title>
  <link rel="stylesheet" href="../assets/fontawesome/fontawesome.css">
  <style>
    body {
      font-family: 'DM Serif Display', serif;
      background: #fff7fa;
      color: #222;
      padding: 2rem;
      margin: 0;
      scroll-behavior: smooth;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .blog-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .post-card {
      position: relative;
      width: 200px;
      height: 200px;
      cursor: pointer;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }
    .post-card.fade-in {
      transform: translateY(0);
      opacity: 1;
    }
    .post-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px;
      font-size: 0.9rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .post-card:hover .overlay {
      opacity: 1;
    }
    .social-icons {
      position: absolute;
      top: 20px;
      right: 30px;
    }
    .social-icons a {
      color: #e6cfe6;
      margin-left: 12px;
      font-size: 1.5rem;
      transition: color 0.3s ease;
    }
    .social-icons a:hover {
      color: #ff66b2;
    }
  </style>
</head>
<body>
<div class="social-icons">
  <a href="https://www.instagram.com/axeliota/" target="_blank"><i class="fab fa-instagram"></i></a>
  <a href="https://www.tiktok.com/@axel.iota" target="_blank"><i class="fab fa-tiktok"></i></a>
  <a href="https://www.twitch.tv/axel_iota" target="_blank"><i class="fab fa-twitch"></i></a>
  <a href="https://snapchat.com/t/ir6vVR5W" target="_blank"><i class="fab fa-snapchat-ghost"></i></a>
  <a href="https://www.youtube.com/@aiota" target="_blank"><i class="fab fa-youtube"></i></a>
</div>

<h1>Axel Iota – Blog</h1>
<div class="blog-grid" id="blogGrid"></div>

<script>
  const posts = [
    {{ thumb: "lisbon.jpg", title: "Lisbon Through My Lens", link: "lisbon-through-my-lens.html" }},
    {{ thumb: "berlin.jpg", title: "Bold Colors, Soft Power", link: "bold-colors-soft-power.html" }},
    {{ thumb: "selfie.jpg", title: "On Being a Creative Nomad", link: "on-being-a-creative-nomad.html" }}
  ];

  const grid = document.getElementById("blogGrid");
  posts.forEach(post => {
    const card = document.createElement("div");
    card.className = "post-card";
    card.innerHTML = `
      <img src="../images/${post.thumb}" alt="">
      <div class="overlay"><h3>${post.title}</h3></div>
    `;
    card.onclick = () => location.href = post.link;
    grid.appendChild(card);
  });

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("fade-in");
        observer.unobserve(entry.target);
      }
    });
  }, {{ threshold: 0.1 }});

  document.querySelectorAll('.post-card').forEach(card => {
    observer.observe(card);
  });
</script>

<div style="margin-top: 3rem; text-align: center;">
  <form action="https://buttondown.email/api/emails/embed-subscribe/aiota" method="post" target="popupwindow" onsubmit="window.open('https://buttondown.com/aiota', 'popupwindow')" class="embeddable-buttondown-form">
    <label for="bd-email">Want rare updates from me? Join the list:</label><br>
    <input type="email" name="email" id="bd-email" placeholder="Your email address" />
    <input type="submit" value="Subscribe" />
  </form>
</div>

</body>
</html>
