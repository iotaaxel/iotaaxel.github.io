<link rel="stylesheet" href="../assets/fontawesome/fontawesome.css">
<style>
  body {
    font-family: 'DM Serif Display', serif;
    background: #fff7fa;
    color: #222;
    max-width: 700px;
    margin: 0 auto;
    padding: 2rem;
  }
  a {
    color: #cc3366;
    text-decoration: none;
  }
  .social-icons {
    position: absolute;
    top: 20px;
    right: 30px;
  }
  .social-icons a {
    color: #e6cfe6;
    margin-left: 12px;
    font-size: 1.5rem;
    transition: color 0.3s ease;
  }
  .social-icons a:hover {
    color: #ff66b2;
  }
  .newsletter {
    margin-top: 3rem;
    padding: 1rem;
    background: #fce6f2;
    border-radius: 8px;
    text-align: center;
  }
  .newsletter input {
    padding: 8px;
    width: 70%;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .newsletter button {
    padding: 8px 16px;
    border: none;
    background: #ff66b2;
    color: white;
    border-radius: 6px;
    margin-left: 10px;
    cursor: pointer;
  }
</style>

  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>

<style>
  #spinner {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 120px;
  }
  .loader {
    border: 4px solid #fce6f2;
    border-top: 4px solid #ff66b2;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

</head>
<body>

<div class="social-icons">
  <a href="https://www.instagram.com/axeliota/" target="_blank"><i class="fab fa-instagram"></i></a>

<script>
  fetch("lisbon-through-my-lens.md")
    .then(response => response.text())
    .then(md => {
      const converter = new showdown.Converter();
      const html = converter.makeHtml(md);
      document.getElementById("content").innerHTML = html;
document.getElementById("spinner").style.display = 'none';
document.getElementById("content").style.display = 'block';
    });
</script>
